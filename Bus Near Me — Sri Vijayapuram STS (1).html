<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bus Near Me — Sri Vijayapuram STS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

    --ink:#12203A; --ink-soft:#4C5A73; --bg:#E9EBEE; --surface:#FFFFFF; --line:#D3D7DE;

    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#ECEFF4; --ink-soft:#9AA6BB; --bg:#0E1520; --surface:#161F2E; --line:#2A3549;
      --navy:#0B1220; --navy-2:#16233B; --amber:#E7A23D; --amber-bg:#3A2C13; --teal:#4FBDA9; --teal-bg:#12332C; --red:#E0685A;
    }
  }
  :root[data-theme="dark"]{
    --ink:#ECEFF4; --ink-soft:#9AA6BB; --bg:#0E1520; --surface:#161F2E; --line:#2A3549;
    --navy:#0B1220; --navy-2:#16233B; --amber:#E7A23D; --amber-bg:#3A2C13; --teal:#4FBDA9; --teal-bg:#12332C; --red:#E0685A;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Space Grotesk', sans-serif; -webkit-font-smoothing:antialiased; }
  .app{ max-width:640px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }
  header{
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%); color:#F4F6FA;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 18px; border-bottom:3px solid var(--amber);
    position:sticky; top:0; z-index:5;
  }
  .brand{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .brand h1{ font-size:1.18rem; margin:0; font-weight:700; }
  .brand h1 span{ color:var(--amber); }
  .clock{ font-family:'IBM Plex Mono', monospace; font-size:1.5rem; font-weight:600; margin-top:8px; }
  .statusline{ margin-top:8px; font-size:0.84rem; color:#C6CEE0; line-height:1.5; }
  .btnrow{ margin-top:10px; display:flex; gap:8px; }
  .btnrow button{
    flex:1; padding:11px 10px; border-radius:9px; border:1px solid rgba(255,255,255,0.28);
    background:var(--amber); color:#1A1206; font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:0.92rem; cursor:pointer;
  }
  .btnrow button.secondary{ background:rgba(255,255,255,0.08); color:#F4F6FA; font-weight:600; flex:0 0 auto; padding:11px 14px; }
  .manual-panel{ margin-top:12px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18); border-radius:10px; padding:12px; }
  .manual-panel.hidden{ display:none; }
  .manual-panel label{ display:block; font-size:0.78rem; color:#C6CEE0; margin-bottom:6px; }
  .manual-panel select, .manual-panel input{
    width:100%; padding:9px 10px; border-radius:7px; border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.08); color:#F4F6FA; font-family:'Space Grotesk',sans-serif; font-size:0.9rem; margin-bottom:8px;
  }
  .manual-panel input::placeholder{ color:#8E99B3; }
  .manual-panel button{
    width:100%; padding:9px 10px; border-radius:7px; border:1px solid var(--amber); background:var(--amber);
    color:#1A1206; font-weight:700; font-family:'Space Grotesk',sans-serif; font-size:0.88rem; cursor:pointer; margin-bottom:4px;
  }
  .manual-divider{ font-size:0.76rem; color:#8E99B3; text-align:center; margin:10px 0 8px; }
  .manual-coords{ display:flex; gap:8px; }
  .manual-coords input{ margin-bottom:8px; }

  main{ flex:1; padding:16px 16px 40px; }
  .hit{
    background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--teal);
    border-radius:12px; padding:13px 14px; margin-bottom:10px;
  }
  .hit.soon{ border-left-color:var(--amber); background:var(--amber-bg); }
  .hit .row1{ display:flex; align-items:center; gap:10px; }
  .hit .route{ font-family:'IBM Plex Mono', monospace; font-size:0.75rem; background:var(--bg); color:var(--ink-soft); padding:3px 7px; border-radius:5px; }
  .hit .path{ font-weight:600; font-size:0.98rem; flex:1; min-width:0; }
  .hit .eta{ font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:0.95rem; color:var(--teal); white-space:nowrap; }
  .hit.soon .eta{ color:var(--amber); }
  .hit .meta{ margin-top:5px; font-size:0.8rem; color:var(--ink-soft); display:flex; gap:14px; flex-wrap:wrap; }
  .hit .meta b{ color:var(--ink); font-family:'IBM Plex Mono',monospace; font-weight:600; }

  .empty{ text-align:center; color:var(--ink-soft); padding:40px 14px; background:var(--surface); border:1px dashed var(--line); border-radius:12px; }
  .empty b{ display:block; color:var(--ink); font-size:1rem; margin-bottom:6px; }

  .section-title{ font-size:0.78rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin:18px 2px 8px; font-weight:600; }
  .foot-note{ font-size:0.76rem; color:var(--ink-soft); text-align:center; margin-top:16px; line-height:1.55; padding:0 6px; }
  .spinner{ text-align:center; padding:40px 10px; color:var(--ink-soft); font-size:0.9rem; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>Bus Near <span>Me</span> · Sri Vijayapuram STS</h1></div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="statusline" id="statusLine">Tap "Locate me" to check buses near you.</div>
    <div class="btnrow">
      <button id="locateBtn" type="button">📍 Locate me</button>
      <button id="refreshBtn" type="button" class="secondary">↻</button>
      <button id="manualBtn" type="button" class="secondary">✎ Manual</button>
    </div>
    <div id="manualPanel" class="manual-panel hidden">
      <label>Nearest known stop (quickest)</label>
      <select id="manualStop"></select>
      <button id="useStopBtn" type="button">Use this stop as my location</button>
      <div class="manual-divider">or enter coordinates</div>
      <div class="manual-coords">
        <input id="manualLat" type="text" inputmode="decimal" placeholder="Latitude, e.g. 11.634">
        <input id="manualLon" type="text" inputmode="decimal" placeholder="Longitude, e.g. 92.702">
      </div>
      <button id="useCoordsBtn" type="button">Use these coordinates</button>
    </div>
  </header>
  <main>
    <div id="resultArea"><div class="empty"><b>Waiting for your location</b>Tap "Locate me" above and allow location access.</div></div>
    <p class="foot-note" id="footNote"></p>
  </main>
</div>

/* ---------- Geometry (equirectangular flat-earth approx — fine over this range) ---------- */
const REF_LAT = 11.65;
const KM_PER_DEG_LAT = 110.574;
const KM_PER_DEG_LON = 111.320 * Math.cos(REF_LAT * Math.PI/180);

function toXY(lat, lon){
  return { x: lon * KM_PER_DEG_LON, y: lat * KM_PER_DEG_LAT };
}
function dist(a, b){ return Math.hypot(a.x-b.x, a.y-b.y); }

// Closest point of a point P to segment A-B, returns {t, point, perpDist}
function closestOnSegment(P, A, B){
  const AB = { x: B.x-A.x, y: B.y-A.y };
  const AP = { x: P.x-A.x, y: P.y-A.y };
  const abLenSq = AB.x*AB.x + AB.y*AB.y;
  let t = abLenSq === 0 ? 0 : (AP.x*AB.x + AP.y*AB.y) / abLenSq;
  t = Math.max(0, Math.min(1, t));
  const pt = { x: A.x + t*AB.x, y: A.y + t*AB.y };
  return { t, perpDist: dist(P, pt) };
}

function toMinutes(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
function fmtEta(mins){
  if (mins <= 0) return 'now';
  if (mins < 60) return 'in ' + mins + ' min';
  const h = Math.floor(mins/60), m = mins % 60;
  return 'in ' + h + 'h' + (m? ' '+m+'m':'');
}
function fmtClock(mins){
  mins = ((mins % 1440) + 1440) % 1440;
  const h = Math.floor(mins/60), m = mins % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

const THRESH_KM = 1.2;        // how close the straight-line path must pass to count as "crossing" you
const WINDOW_MIN = 30;        // look-ahead window

let userPos = null; // {lat, lon}
let watchId = null;

function computeHits(now){
  if (!userPos) return [];
  const P = toXY(userPos.lat, userPos.lon);
  const hits = [];
  PB_TRIPS.forEach(t=>{
    const [route, depStr, from, to, arrStr, note] = t;
    const fromC = coordOf(from), toC = coordOf(to);
    if (!fromC || !toC) return;
    let depMin = toMinutes(depStr), arrMin = toMinutes(arrStr);
    if (arrMin <= depMin) arrMin += 1440; // overnight halt edge case
    const D = arrMin - depMin;
    const A = toXY(fromC[0], fromC[1]);
    const B = toXY(toC[0], toC[1]);
    const { t: frac, perpDist } = closestOnSegment(P, A, B);
    if (perpDist > THRESH_KM) return;
    const closestMin = depMin + frac * D;
    const etaMin = closestMin - now;
    if (etaMin < -2 || etaMin > WINDOW_MIN) return; // allow a 2-min grace for "just now"
    // current live position / distance, if bus is currently running
    let liveDistKm = null;
    if (now >= depMin && now <= arrMin){
      const f = (now - depMin) / D;
      const cur = { x: A.x + f*(B.x-A.x), y: A.y + f*(B.y-A.y) };
      liveDistKm = dist(P, cur);
    }
    hits.push({ route, from, to, note, depStr, arrStr, perpDist, etaMin: Math.round(etaMin), closestClock: fmtClock(closestMin), liveDistKm });
  });
  hits.sort((a,b)=> a.etaMin - b.etaMin);
  return hits;
}

function renderHits(hits){
  const el = document.getElementById('resultArea');
  if (!hits.length){
    el.innerHTML = '<div class="empty"><b>No bus passes near you in the next 30 minutes</b>Based on straight-line paths between Bus Terminus and each destination — try again closer to a known stop, or check the full timetable for routes further out.</div>';
    return;
  }
  el.innerHTML = '<div class="section-title">Crossing near you — next 30 minutes</div>' +
    hits.map(h=>{
      const soon = h.etaMin <= 10;
      const liveBit = h.liveDistKm != null ? `<span>live ≈ <b>${h.liveDistKm.toFixed(1)} km</b> from you</span>` : '';
      return `<div class="hit ${soon?'soon':''}">
        <div class="row1">
          <span class="route">${h.route}</span>
          <span class="path">${h.from} → ${h.to}</span>
          <span class="eta">${fmtEta(h.etaMin)}</span>
        </div>
        <div class="meta">
          <span>passes closest to you ≈ <b>${h.closestClock}</b></span>
          <span>≈ <b>${h.perpDist.toFixed(1)} km</b> off your spot</span>
          ${liveBit}
        </div>
      </div>`;
    }).join('');
}

function tick(){
  const d = new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
  if (userPos){
    const now = d.getHours()*60 + d.getMinutes();
    renderHits(computeHits(now));
  }
}

function locate(){
  const status = document.getElementById('statusLine');
  if (!navigator.geolocation){
    status.textContent = 'Geolocation isn\'t available on this device/browser.';
    return;
  }
  status.textContent = 'Getting your location…';
  document.getElementById('resultArea').innerHTML = '<div class="spinner">Locating you…</div>';
  navigator.geolocation.getCurrentPosition(pos=>{
    userPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    status.textContent = 'Location locked (±' + Math.round(pos.coords.accuracy) + 'm). Checking the timetable against your position…';
    const now = new Date(); const nowMin = now.getHours()*60 + now.getMinutes();
    renderHits(computeHits(nowMin));
    if (watchId === null){
      watchId = navigator.geolocation.watchPosition(p=>{
        userPos = { lat: p.coords.latitude, lon: p.coords.longitude };
      }, ()=>{}, { enableHighAccuracy:true, maximumAge:15000 });
    }
  }, err=>{
    status.textContent = 'Could not get your location (' + err.message + '). Try the browser fixes below, or tap "✎ Manual" to set your spot by hand.';
    document.getElementById('resultArea').innerHTML = '<div class="empty"><b>Location unavailable</b>Your browser blocked or failed to get a location — often because the page is open inside an embedded view, or a site permission is set to block. Use "✎ Manual" above as a quick workaround.</div>';
  }, { enableHighAccuracy:true, timeout:10000, maximumAge:5000 });
}

document.getElementById('locateBtn').addEventListener('click', locate);
document.getElementById('refreshBtn').addEventListener('click', ()=>{
  const now = new Date(); const nowMin = now.getHours()*60 + now.getMinutes();
  if (userPos) renderHits(computeHits(nowMin));
});

/* ---------- Manual location fallback (for when browser geolocation is blocked) ---------- */
const manualPanel = document.getElementById('manualPanel');
const manualStopSelect = document.getElementById('manualStop');
Object.keys(COORDS).sort().forEach(name=>{
  const opt = document.createElement('option');
  opt.value = name; opt.textContent = name;
  manualStopSelect.appendChild(opt);
});

function applyManualPos(lat, lon, label){
  userPos = { lat, lon };
  const status = document.getElementById('statusLine');
  status.textContent = 'Using manual location: ' + label + '. Checking the timetable…';
  manualPanel.classList.add('hidden');
  const now = new Date(); const nowMin = now.getHours()*60 + now.getMinutes();
  renderHits(computeHits(nowMin));
}

document.getElementById('manualBtn').addEventListener('click', ()=>{
  manualPanel.classList.toggle('hidden');
});
document.getElementById('useStopBtn').addEventListener('click', ()=>{
  const name = manualStopSelect.value;
  const c = COORDS[name];
  if (c) applyManualPos(c[0], c[1], name);
});
document.getElementById('useCoordsBtn').addEventListener('click', ()=>{
  const lat = parseFloat(document.getElementById('manualLat').value);
  const lon = parseFloat(document.getElementById('manualLon').value);
  if (isFinite(lat) && isFinite(lon)){
    applyManualPos(lat, lon, lat.toFixed(4)+', '+lon.toFixed(4));
  } else {
    document.getElementById('statusLine').textContent = 'Enter valid numbers for latitude and longitude.';
  }
});

document.getElementById('footNote').textContent =
  'Covers the Sri Vijayapuram (Port Blair) STS bus unit only. Each route is approximated as a straight line from Bus Terminus to its destination, with the bus assumed to move at constant speed between the printed departure and arrival times — real roads curve, so treat the distance and timing as estimates, not exact.';

tick();
setInterval(tick, 1000);
</script>
